###############################################################################
# jhwx - Jepps Hill weather UI skin for WeeWX 5
#
# Writes static JSON (data/*.json) and NOAA text reports each report cycle for
# a static front end that also takes live values from MQTT.  Every generated
# JSON file is already metric (see [Units]); the front end must not convert it.
###############################################################################

SKIN_NAME = jhwx
SKIN_VERSION = 0.1.0

[Extras]
    # Generic defaults.  Override any of these for one install in weewx.conf,
    # under [StdReport] [[jhwx]] [[[Extras]]] (subsections one level deeper,
    # e.g. [[[[power]]]]), so the skin itself can be updated without losing them.

    # Data binding for "current" values (latest record, today's highs/lows).
    # History (NOAA, charts, almanac, records) uses the report's data_binding,
    # which can point at a different database (e.g. a snapshot when testing).
    live_binding = wx_binding

    # MQTT websocket for live loop packets.  Relative URLs are resolved
    # against the page URL and switched to ws:// or wss:// to match http(s),
    # so "mqtt" means <page dir>/mqtt.  The web server proxies that path to
    # Mosquitto's websocket listener (anonymous, read-only).
    mqtt_url = mqtt
    mqtt_topic = weather/loop

    # Header: short station name (footer, chart markers; blank = the WeeWX
    # hardware name) and the line under the station name.
    station_short = ""
    subtitle = ""

    # When the current station hardware took over (local time), marked on
    # charts.  Blank = no marker.
    cutover = ""

    # (configobj: keep plain options above the [[subsections]]; anything after
    # a subsection header belongs to that subsection.)

    # Sensor names, used when one stops reporting ("No data from Outdoor ...")
    # and in the history pop-up header.
    [[sensors]]
        outdoor = Outdoor
        console = Console
        rain = Rain gauge

    # Readings whose records and charts are only valid from a given local time
    # (e.g. a faulty sensor on earlier hardware):  radiation = 2026-10-24 19:45
    [[record_cutoff]]

    # Voltage tiles and gauges.  Name the archive fields that hold them (blank
    # hides the tile); e.g. an Ecowitt WS90 mapped to supplyVoltage (supercap)
    # and batteryStatus1 (backup battery).
    [[power]]
        supercap = ""
        supercap_label = Supercap
        supercap_max = 6
        # below this the sensor runs on its batteries (WS90: about 2.5 V)
        supercap_low = 2.5
        battery = ""
        battery_label = Backup battery
        battery_min = 2.0
        battery_max = 3.6
        # below these the battery tile says Low / Fair
        battery_low = 2.4
        battery_fair = 2.8

    # Indicative fire danger: McArthur Forest FFDI with Australian (AFDRS)
    # rating levels.  Only meaningful in Australia.  info_* link to the
    # official ratings for the area.
    [[fire_danger]]
        enable = false
        info_name = ""
        info_url = ""
        info_extra = ""

    # Pressure chart (isobars from an Open-Meteo grid, fetched by WeeWX at
    # most every 6 hours, ~400 API calls each time).  bounds = north, south,
    # west, east in degrees; blank = 42 x 78 degrees centred on the station.
    # chart_* link to an official analysed chart.
    [[mslp]]
        enable = true
        bounds = ""
        chart_name = ""
        chart_url = ""

    # Lightning map: strikes from the Xweather Weather API (free Developer
    # plan: 15,000 tokens a month; a strike count costs 1, a strike list 10).
    # WeeWX counts strikes every 30 min, every 10 min while the Open-Meteo
    # forecast shows thunderstorms or CAPE of at least `cape` J/kg (or for an
    # hour after a strike), fetches the list only when there are strikes, and
    # stops at daily_tokens / monthly_tokens.  Put client_id and client_secret
    # in weewx.conf ([StdReport] [[jhwx]] [[[Extras]]] [[[[lightning]]]]),
    # not in this file.
    [[lightning]]
        enable = false
        client_id = ""
        client_secret = ""
        radius_km = 100
        daily_tokens = 480
        monthly_tokens = 14000
        cape = 500

[Units]
    [[Groups]]
        group_altitude = meter
        group_degree_day = degree_C_day
        group_distance = km
        group_pressure = hPa
        group_rain = mm
        group_rainrate = mm_per_hour
        group_speed = km_per_hour
        group_speed2 = km_per_hour2
        group_temperature = degree_C

    [[DegreeDays]]
        heating_base = 18, degree_C
        cooling_base = 18, degree_C

[CheetahGenerator]
    encoding = utf8
    search_list_extensions = user.jhwx.JhwxSearch

    [[SummaryByMonth]]
        [[[NOAA_month]]]
            encoding = normalized_ascii
            template = NOAA/NOAA-%Y-%m.txt.tmpl

    [[SummaryByYear]]
        [[[NOAA_year]]]
            encoding = normalized_ascii
            template = NOAA/NOAA-%Y.txt.tmpl

    [[ToDate]]
        [[[config]]]
            template = data/config.json.tmpl
        [[[current]]]
            template = data/current.json.tmpl
        [[[astro]]]
            template = data/astro.json.tmpl
        [[[day]]]
            template = data/day.json.tmpl
        [[[week]]]
            template = data/week.json.tmpl
        [[[month]]]
            template = data/month.json.tmpl
        [[[year]]]
            template = data/year.json.tmpl
        [[[almanac]]]
            template = data/almanac.json.tmpl
        [[[noaa_index]]]
            template = data/noaa-index.json.tmpl
        [[[mslp]]]
            template = data/mslp.json.tmpl
        [[[fire]]]
            template = data/fire.json.tmpl
        [[[lightning]]]
            template = data/lightning.json.tmpl

[CopyGenerator]
    copy_always = index.html, css/*.css, js/*.js, js/vendor/*.*, js/vendor/leaflet-1.9.4/*, fonts/*, img/*

[Generators]
    generator_list = weewx.cheetahgenerator.CheetahGenerator, weewx.reportengine.CopyGenerator
